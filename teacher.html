<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O‘qituvchi paneli | Sufiollohyor</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #10151f;
      color: white;
      margin: 0;
      padding: 20px;
    }
    main { max-width: 800px; margin: 30px auto; }
    section {
      background: #ffffff0d;
      border: 1px solid #ffffff35;
      border-radius: 16px;
      padding: 22px;
      margin: 16px 0;
    }
    a, button {
      display: inline-block;
      background: #f28c28;
      color: #111;
      padding: 12px 16px;
      border: 0;
      border-radius: 9px;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>📚 O‘qituvchi paneli</h1>
    <p>Sufiollohyor o‘quv markazi</p>

    <section>
      <h2>Darslarni boshqarish</h2>
      <p>Dars jadvali va o‘quvchilar reytingi keyingi bosqichlarda ulanadi.</p>
      <a href="schedule.html">Dars jadvali</a>
      <a href="ranking.html">Reyting</a>
      <a href="index.html">Bosh sahifa</a>
    </section>

    <section>
      <h2>Hisobdan chiqish</h2>
      <button id="logout">Chiqish</button>
      <p id="message"></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    document.getElementById('logout').addEventListener('click', async () => {
      const message = document.getElementById('message');
      try {
        const config = window.SUFIOLLOHYOR_CONFIG;
        const client = window.supabase.createClient(
          config.SUPABASE_URL,
          config.SUPABASE_ANON_KEY
        );
        const { error } = await client.auth.signOut();
        if (error) throw error;
        location.href = 'login.html';
      } catch (error) {
        message.textContent = 'Xatolik: ' + error.message;
      }
    });
  </script>
</body>
</html>
