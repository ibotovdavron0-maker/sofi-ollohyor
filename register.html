<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ro‘yxatdan o‘tish | Sufiollohyor</title><link rel="stylesheet" href="neon.css"></head><body><main style="min-height:100vh;display:grid;place-items:center;padding:18px"><form id="reg" class="glass panel" style="width:min(100%,410px);padding:25px"><div class="brand"><div class="logo">♨</div><div><b>SUFIOLLOHYOR</b><small>YANGI AKKAUNT</small></div></div><h1>Ro‘yxatdan o‘tish</h1><p class="sub">O‘quvchi akkauntini yarating.</p><input id="name" required placeholder="Ism-familiya" style="width:100%;padding:12px;margin:5px 0 10px;background:#050d1c;border:1px solid #3475b966;border-radius:9px;color:white"><input id="email" type="email" required placeholder="Email" style="width:100%;padding:12px;margin:5px 0 10px;background:#050d1c;border:1px solid #3475b966;border-radius:9px;color:white"><input id="pass" type="password" minlength="8" required placeholder="Parol (kamida 8 belgi)" style="width:100%;padding:12px;margin:5px 0 12px;background:#050d1c;border:1px solid #3475b966;border-radius:9px;color:white"><button class="btn primary">Akkaunt yaratish</button><p id="msg" class="sub"></p><a class="sub" href="login.html">Kirish sahifasiga qaytish</a></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>document.querySelector('#reg').onsubmit=async e=>{e.preventDefault();const m=document.querySelector('#msg');try{const c=window.SUFIOLLOHYOR_CONFIG;if(c.SUPABASE_ANON_KEY.includes('PASTE_'))throw Error('Avval config.js sozlang.');const sb=window.supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY);const {error}=await sb.auth.signUp({email:document.querySelector('#email').value,password:document.querySelector('#pass').value,options:{data:{full_name:document.querySelector('#name').value}}});if(error)throw error;m.textContent='Ro‘yxatdan o‘tish so‘rovi yuborildi. Emailingizni tekshiring.'}catch(err){m.textContent=err.message}}</script></body></html>
