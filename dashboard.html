<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>O‘quvchi kabineti | Sufiollohyor</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #10151f;
      color: white;
      padding: 20px;
    }
    main { max-width: 800px; margin: 30px auto; }
    section {
      padding: 22px;
      margin: 16px 0;
      border: 1px solid #ffffff35;
      border-radius: 16px;
      background: #ffffff0d;
    }
    a, button {
      display: inline-block;
      padding: 12px 16px;
      margin: 5px;
      border: 0;
      border-radius: 9px;
      background: #f28c28;
      color: #111;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>🎓 O‘quvchi kabineti</h1>
    <p id="welcome">Ma’lumot yuklanmoqda...</p>

    <section>
      <h2>Mening bo‘limlarim</h2>
      <a href="courses.html">Kurslar</a>
      <a href="schedule.html">Dars jadvali</a>
      <a href="ranking.html">Reyting</a>
      <a href="results.html">Natijalar</a>
    </section>

    <section>
      <h2>Hisob</h2>
      <button id="logout">Tizimdan chiqish</button>
      <p id="message"></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    async function start() {
      const welcome = document.getElementById('welcome');
      const message = document.getElementById('message');

      try {
        const config = window.SUFIOLLOHYOR_CONFIG;
        const client = window.supabase.createClient(
          config.SUPABASE_URL,
          config.SUPABASE_ANON_KEY
        );

        const { data, error } = await client.auth.getUser();
        if (error || !data.user) {
          location.href = 'login.html';
          return;
        }

        const { data: profile, error: profileError } = await client
          .from('profiles')
          .select('full_name, role')
          .eq('id', data.user.id)
          .single();

        if (profileError) throw profileError;

        if (profile.role === 'admin') {
          location.href = 'admin.html';
          return;
        }

        if (profile.role === 'teacher') {
          location.href = 'teacher.html';
          return;
        }

        welcome.textContent = 'Xush kelibsiz, ' +
          (profile.full_name || data.user.email || 'o‘quvchi') + '!';
      } catch (error) {
        welcome.textContent = 'Xatolik: ' + error.message;
      }
    }

    document.getElementById('logout').addEventListener('click', async () => {
      try {
        const config = window.SUFIOLLOHYOR_CONFIG;
        const client = window.supabase.createClient(
          config.SUPABASE_URL,
          config.SUPABASE_ANON_KEY
        );
        const { error } = await client.auth.signOut();
        if (error) throw error;
        location.href = 'login.html';
      } catch (error) {
        document.getElementById('message').textContent =
          'Xatolik: ' + error.message;
      }
    });

    start();
  </script>
</body>
</html>
