<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kirish | Sufiollohyor</title><link rel="stylesheet" href="neon.css"></head><body><main style="min-height:100vh;display:grid;place-items:center;padding:18px"><form class="glass panel" id="loginForm" style="width:min(100%,410px);padding:25px"><div class="brand" style="padding:0 0 22px"><div class="logo">♨</div><div><b>SUFIOLLOHYOR</b><small>SHAXSIY KABINET</small></div></div><div class="eyebrow">XUSH KELIBSIZ</div><h1 style="font-size:25px;margin:8px 0">Tizimga kirish</h1><p class="sub">Email va parolingiz bilan kiring.</p><label class="sub" for="email">Email</label><input id="email" type="email" required placeholder="siz@example.com" style="display:block;width:100%;margin:6px 0 12px;padding:12px;background:#050d1c;border:1px solid #3475b966;border-radius:9px;color:white"><label class="sub" for="password">Parol</label><input id="password" type="password" required placeholder="Parolingiz" style="display:block;width:100%;margin:6px 0 14px;padding:12px;background:#050d1c;border:1px solid #3475b966;border-radius:9px;color:white"><button class="btn primary" style="width:100%;justify-content:center">Kirish →</button><p id="message" class="sub"></p><p class="sub">Akkauntingiz yo‘qmi? <a href="register.html" style="color:#70d8ff">Ro‘yxatdan o‘ting</a></p><a href="index.html" class="sub">← Bosh sahifaga qaytish</a></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>document.querySelector('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const m=document.querySelector('#message');try{const c=window.SUFIOLLOHYOR_CONFIG;if(!c||c.SUPABASE_ANON_KEY.includes('PASTE_'))throw Error('config.js ichiga Supabase publishable key kiriting.');const sb=window.supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY);const {data,error}=await sb.auth.signInWithPassword({email:document.querySelector('#email').value,password:document.querySelector('#password').value});if(error)throw error;const {data:p}=await sb.from('profiles').select('role').eq('id',data.user.id).maybeSingle();location.href=p?.role==='admin'?'admin.html':p?.role==='teacher'?'teacher.html':'dashboard.html'}catch(err){m.textContent=err.message}})</script></body></html>
