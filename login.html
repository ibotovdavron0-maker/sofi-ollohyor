<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kirish | So‘fi Ollohyor</title>
  <link rel="stylesheet" href="style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top right, #ff7b22, transparent 35%),
        linear-gradient(135deg, #10131c, #252b38);
      color: #fff;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 30px 24px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 22px;
      background: rgba(255,255,255,.10);
      backdrop-filter: blur(15px);
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    .subtitle {
      text-align: center;
      color: #d5d9e2;
      margin-bottom: 26px;
    }

    label {
      display: block;
      margin: 16px 0 8px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #747d90;
      border-radius: 10px;
      background: rgba(0,0,0,.2);
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 16px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #ff842e;
      color: #151515;
    }

    .google {
      background: #fff;
      color: #222;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .links {
      text-align: center;
      margin-top: 22px;
      line-height: 2;
    }

    a {
      color: #ffd0a9;
    }

    #message {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: #ffe0a8;
      margin-top: 16px;
    }

    .separator {
      text-align: center;
      margin-top: 18px;
      color: #d5d9e2;
    }
  </style>
</head>

<body>
  <main class="login-card">
    <h1>So‘fi Ollohyor</h1>
    <p class="subtitle">Shaxsiy kabinetingizga kiring</p>

    <form id="loginForm">
      <label for="email">Email manzil</label>
      <input
        id="email"
        type="email"
        placeholder="email@example.com"
        autocomplete="email"
        required
      >

      <label for="password">Parol</label>
      <input
        id="password"
        type="password"
        placeholder="Parolingiz"
        autocomplete="current-password"
        required
      >

      <button class="primary" id="loginButton" type="submit">
        Kirish
      </button>
    </form>

    <div class="separator">yoki</div>

    <button class="google" id="googleLogin" type="button">
      Google orqali kirish
    </button>

    <p id="message" role="status" aria-live="polite"></p>

    <div class="links">
      Hisobingiz yo‘qmi?
      <a href="register.html">Ro‘yxatdan o‘tish</a>
      <br>
      <a href="index.html">Bosh sahifaga qaytish</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <script>
    const message = document.getElementById('message');
    const loginForm = document.getElementById('loginForm');
    const loginButton = document.getElementById('loginButton');
    const googleButton = document.getElementById('googleLogin');

    let client;

    try {
      const config = window.SUFIOLLOHYOR_CONFIG;

      if (
        !config ||
        !config.SUPABASE_URL ||
        !config.SUPABASE_ANON_KEY
      ) {
        throw new Error('config.js sozlamalarini tekshiring.');
      }

      client = window.supabase.createClient(
        config.SUPABASE_URL,
        config.SUPABASE_ANON_KEY
      );
    } catch (error) {
      message.textContent = 'Sozlama xatosi: ' + error.message;
    }

    // Email va parol orqali kirish
    loginForm.addEventListener('submit', async function (event) {
      event.preventDefault();

      if (!client) return;

      loginButton.disabled = true;
      message.textContent = 'Tekshirilmoqda...';

      try {
        const { data, error } = await client.auth.signInWithPassword({
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value
        });

        if (error) throw error;

        const { data: profile, error: profileError } = await client
          .from('profiles')
          .select('role')
          .eq('id', data.user.id)
          .single();

        if (profileError) {
          throw new Error(
            'Profil topilmadi. Supabase profiles jadvali va ruxsatlarini tekshiring.'
          );
        }

        if (profile.role === 'admin') {
          window.location.href = 'admin.html';
        } else if (profile.role === 'teacher') {
          window.location.href = 'teacher.html';
        } else {
          window.location.href = 'dashboard.html';
        }
      } catch (error) {
        message.textContent = 'Kirish xatosi: ' + error.message;
      } finally {
        loginButton.disabled = false;
      }
    });

    // Google orqali kirish
    googleButton.addEventListener('click', async function () {
      if (!client) return;

      googleButton.disabled = true;
      message.textContent = 'Google sahifasiga yo‘naltirilmoqda...';

      try {
        const { error } = await client.auth.signInWithOAuth({
          provider: 'google',
          options: {
            redirectTo:
              'https://ibotovdavron0-maker.github.io/sofi-ollohyor/'
          }
        });

        if (error) throw error;
      } catch (error) {
        message.textContent = 'Google orqali kirish xatosi: ' + error.message;
        googleButton.disabled = false;
      }
    });
  </script>
</body>
</html>
