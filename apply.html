<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ariza berish | Sufiollohyor</title><link rel="stylesheet" href="neon.css"></head><body><main style="min-height:100vh;display:grid;place-items:center;padding:18px"><form id="apply" class="glass panel" style="width:min(100%,520px);padding:24px"><div class="brand"><div class="logo">♨</div><div><b>SUFIOLLOHYOR</b><small>ARIZA QOLDIRISH</small></div></div><div class="eyebrow">BIZ BILAN O‘QING</div><h1>Ariza qoldirish</h1><p class="sub">Ma’lumotlaringizni kiriting. Markaz xodimi siz bilan bog‘lanadi.</p><label class="sub">Ism-familiya</label><input name="name" required placeholder="Ism va familiya" style="display:block;width:100%;padding:12px;margin:6px 0 12px;background:#050d1c;border:1px solid #3475b966;border-radius:9px;color:white"><label class="sub">Telefon</label><input name="phone" required type="tel" placeholder="+998 90 123 45 67" style="display:block;width:100%;padding:12px;margin:6px 0 12px;background:#050d1c;border:1px solid #3475b966;border-radius:9px;color:white"><label class="sub">Kurs</label><select name="course" required style="display:block;width:100%;padding:12px;margin:6px 0 12px;background:#050d1c;border:1px solid #3475b966;border-radius:9px;color:white"><option value="">Kursni tanlang</option><option>Matematika</option><option>Ingliz tili</option><option>Informatika</option><option>Fizika</option><option>Kimyo</option></select><button class="btn primary">Arizani yuborish →</button><p id="msg" class="sub"></p><a class="sub" href="index.html">← Bosh sahifaga qaytish</a></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>document.querySelector('#apply').onsubmit=async e=>{e.preventDefault();const m=document.querySelector('#msg'),f=new FormData(e.target),v=Object.fromEntries(f.entries());try{const c=window.SUFIOLLOHYOR_CONFIG;if(!c||c.SUPABASE_ANON_KEY.includes('PASTE_'))throw Error('Ariza yuborish uchun config.js ichiga Supabase publishable key kiriting.');const sb=window.supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY);const {error}=await sb.from('applications').insert({name:v.name,phone:v.phone,course:v.course,status:'new'});if(error)throw error;m.textContent='Arizangiz yuborildi. Rahmat!';e.target.reset()}catch(err){m.textContent='Ariza yuborilmadi: '+err.message+' — Supabase applications jadvali va INSERT RLS ruxsatini tekshiring.'}}</script></body></html>
